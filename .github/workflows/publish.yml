name: Publish to PyPI

# Publishing is driven entirely by tags. Push a v* tag whose number matches the
# version in pyproject.toml and this workflow builds, tests and publishes it.
# Nothing publishes on a push to main, so an ordinary merge is never a release.
#
# Authentication uses PyPI trusted publishing (OIDC), so there is no API token
# stored in this repository. That has to be configured once on PyPI before the
# first tag; see RELEASING.md for the exact values.

on:
  push:
    tags:
      - "v*"
  # Lets you rehearse a release against a tag without publishing.
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI as well as build and test"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Check the tag matches the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version $tag but pyproject.toml says $version."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches version $version."

      - name: Build the sdist and wheel
        run: python -m build

      # --strict turns README rendering warnings into failures. PyPI rejects a
      # bad description at upload time, which is much later and harder to undo.
      - name: Check the distributions
        run: python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    name: Test on ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject.toml, and the newest supported.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and its test dependencies
        run: python -m pip install --upgrade ".[dev]"

      - name: Run the tests
        run: python -m pytest -q

  publish:
    name: Publish to PyPI
    # Never publish something that did not build cleanly and pass its tests.
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    runs-on: ubuntu-latest
    # Attach a protection rule to this environment on GitHub if you want a
    # manual approval step between pushing the tag and the upload happening.
    environment:
      name: pypi
      url: https://pypi.org/p/inmydata
    permissions:
      # Required for trusted publishing. Without it the upload is rejected.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
